name: Supabase keepalive

# Pings the submit-lead function twice a week so the Supabase free project
# never pauses from inactivity (~7 idle days would take down DB + functions).
on:
  schedule:
    - cron: '17 9 * * 1,4' # Mon + Thu 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping submit-lead
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://oxamipkpkkyhfjrmvbgs.supabase.co/functions/v1/submit-lead?ping=1')
          echo "Ping returned HTTP $code"
          test "$code" = "200"
